[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cove-gif-maker"
version = "2.0.0"
description = "Trim videos and convert them to optimized GIFs / WebPs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cove" }]
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
cove-gif-maker = "cove_gif_maker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cove_gif_maker = ["assets/*.png", "assets/*.ico"]
